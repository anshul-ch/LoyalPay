<div class="max-w-6xl mx-auto space-y-6">
  
  <div class="flex justify-between items-center">
    <h2 class="text-2xl font-bold text-gray-900">Support Center</h2>
    <button type="button" (click)="toggleForm()" class="btn-primary">
      {{ showForm ? 'Cancel' : 'Open New Ticket' }}
    </button>
  </div>

  <div *ngIf="message" class="bg-green-50 text-green-700 p-4 rounded">{{ message }}</div>
  <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded">{{ error }}</div>

  <!-- Create Ticket Form -->
  <div *ngIf="showForm" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <h3 class="text-lg font-medium text-gray-900 mb-4">Submit a Request</h3>
    <div class="space-y-4 max-w-2xl">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="text" [value]="email" readonly class="input-field mt-1 py-2 px-3 border bg-gray-50 text-gray-600" placeholder="Signed-in email address">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Subject</label>
        <input type="text" [(ngModel)]="subject" class="input-field mt-1 py-2 px-3 border" placeholder="Brief summary of the issue">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Category</label>
        <select [(ngModel)]="category" (ngModelChange)="onCategoryChange()" class="input-field mt-1 py-2 px-3 border bg-white">
          <option value="AccountAccess">Account Access</option>
          <option value="PinReset">PIN Reset</option>
          <option value="PaymentIssue">Payment Issue</option>
          <option value="TransactionDispute">Transaction Dispute</option>
          <option value="KycProblem">KYC Problem</option>
          <option value="Rewards">Rewards Program</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Type of Reason</label>
        <select [(ngModel)]="issueType" class="input-field mt-1 py-2 px-3 border bg-white">
          <option *ngFor="let issue of issueOptions()" [value]="issue">{{ issue }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Description</label>
        <textarea [(ngModel)]="description" rows="4" class="input-field mt-1 py-2 px-3 border" placeholder="Please provide as much detail as possible..."></textarea>
      </div>
      <button type="button" (click)="createTicket()" [disabled]="isSubmitting" class="btn-primary disabled:bg-gray-400 disabled:cursor-not-allowed">
        <span *ngIf="isSubmitting">Submitting...</span>
        <span *ngIf="!isSubmitting">Submit Ticket</span>
      </button>
    </div>
  </div>

  <!-- Tickets List -->
  <div *ngIf="!showForm" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-5 border-b border-gray-200">
      <h3 class="text-lg font-medium text-gray-900">My Tickets</h3>
    </div>
    
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Ticket ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subject</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Category</th>
            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Status</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Date</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngIf="isLoading"><td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">Loading...</td></tr>
          <tr *ngIf="!isLoading && tickets.length === 0"><td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">You have no support tickets.</td></tr>
          <tr *ngFor="let t of tickets" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#{{ t.ticketNumber }}</td>
            <td class="px-6 py-4 text-sm text-gray-900">{{ t.subject }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ t.category }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-center">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-green-100 text-green-800': t.status === 'Resolved' || t.status === 'Closed',
                  'bg-blue-100 text-blue-800': t.status === 'InProgress',
                  'bg-yellow-100 text-yellow-800': t.status === 'Open'
                }">
                {{ t.status === 'Closed' ? 'Resolved' : t.status }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-right text-gray-500">{{ t.createdAt | date:'shortDate' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
