<div class="space-y-6">
  <h2 class="text-2xl font-bold text-gray-900">Support Agents</h2>
  <div class="card p-6 max-w-2xl space-y-3">
    <h3 class="font-semibold">Create Support Agent</h3>
    <div *ngIf="message" class="p-3 bg-green-50 text-green-700 rounded">{{ message }}</div>
    <div *ngIf="error" class="p-3 bg-red-50 text-red-700 rounded">{{ error }}</div>
    <input [(ngModel)]="form.fullName" class="input-field py-2 px-3 border" placeholder="Full name">
    <input [(ngModel)]="form.email" class="input-field py-2 px-3 border" placeholder="Email">
    <input [(ngModel)]="form.phone" class="input-field py-2 px-3 border" placeholder="10 digit phone">
    <input type="password" [(ngModel)]="form.password" class="input-field py-2 px-3 border" placeholder="Password">
    <button (click)="create()" class="btn-primary">Create Agent</button>
  </div>
  <div class="card overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Phone</th><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th></tr></thead>
      <tbody class="divide-y divide-gray-200"><tr *ngFor="let agent of agents"><td class="px-4 py-3">{{ agent.fullName }}</td><td class="px-4 py-3">{{ agent.email }}</td><td class="px-4 py-3">{{ agent.phone }}</td><td class="px-4 py-3">{{ agent.isActive ? 'Active' : 'Inactive' }}</td></tr></tbody>
    </table>
  </div>
</div>
